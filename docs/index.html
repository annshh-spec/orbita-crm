<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Орбита CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* Светлая тема — «стекло» на лавандово-голубом фоне; тёмная — ночной синий с бирюзовым свечением */
:root,[data-theme=light]{color-scheme:light;
 --bg:#eef1ff;--bg2:#f5eeff;--b1:#c7d2fe;--b2:#e9d5ff;--b3:#bae6fd;
 --card:rgba(255,255,255,.62);--card2:rgba(255,255,255,.82);--solid:#fff;--stroke:rgba(255,255,255,.85);
 --line:rgba(91,95,240,.12);--ink:#141a3a;--mu:#6b7194;--acc:#5b5ff0;--acc2:#a855f7;--sky:#60a5fa;--pink:#ec4899;
 --ok:#16a34a;--okbg:rgba(22,163,74,.12);--bad:#e11d48;--badbg:rgba(225,29,72,.1);--warn:#d97706;
 --input:rgba(255,255,255,.8);--shadow:0 12px 32px rgba(76,82,190,.10);--hover:rgba(91,95,240,.07);--tile:rgba(91,95,240,.12)}
[data-theme=dark]{color-scheme:dark;
 --bg:#061024;--bg2:#0a1a38;--b1:#1b3a7a;--b2:#16305e;--b3:#0e4a5e;
 --card:rgba(16,34,70,.62);--card2:rgba(20,42,84,.85);--solid:#0f2142;--stroke:rgba(120,170,255,.14);
 --line:rgba(140,180,255,.12);--ink:#e8eeff;--mu:#8fa0c8;--acc:#4f8cff;--acc2:#38d6e8;--sky:#38bdf8;--pink:#f472b6;
 --ok:#34d399;--okbg:rgba(52,211,153,.14);--bad:#fb7185;--badbg:rgba(251,113,133,.14);--warn:#fbbf24;
 --input:rgba(8,20,44,.7);--shadow:0 14px 40px rgba(0,0,0,.35);--hover:rgba(79,140,255,.10);--tile:rgba(79,140,255,.16)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
html{background:var(--bg)}
body{font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg),var(--bg2));background-attachment:fixed;overflow-x:clip}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:radial-gradient(40vw 40vw at 8% 12%,var(--b1),transparent 60%),radial-gradient(38vw 38vw at 92% 8%,var(--b2),transparent 60%),radial-gradient(45vw 45vw at 70% 95%,var(--b3),transparent 60%);opacity:.75}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.boot{display:grid;place-items:center;min-height:100vh;color:var(--mu)}
.glass{background:var(--card);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--stroke);border-radius:20px;box-shadow:var(--shadow)}
[data-theme=dark] .glass{box-shadow:var(--shadow),inset 0 1px 0 rgba(140,190,255,.08)}

/* каркас */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;gap:18px;padding:18px}
.side{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;padding:18px 14px;gap:6px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo b{font-size:18px;font-weight:800;line-height:1.1}.logo small{display:block;color:var(--mu);font-size:12px;font-weight:500}
.logo .mk{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;flex:none}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--mu);text-decoration:none;font-weight:600;min-height:44px}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.on{background:var(--card2);color:var(--acc);box-shadow:0 6px 18px rgba(91,95,240,.12)}
.nav .cnt{margin-left:auto;background:var(--tile);color:var(--acc);font-size:12px;padding:1px 8px;border-radius:20px}
.side .sp{flex:1}
.promo{border-radius:16px;padding:14px;color:#fff;background:linear-gradient(140deg,var(--acc),var(--acc2));margin:10px 0;font-size:13px}
.promo b{font-size:14px;display:block;margin-bottom:6px}
.promo .who{display:flex;align-items:center;gap:8px;margin-top:6px}
.promo .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.themesw{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--hover);padding:4px;border-radius:12px}
.themesw button{border:0;background:none;border-radius:9px;padding:8px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--mu);font-weight:600;font-size:13px;min-height:38px}
.themesw button.on{background:var(--card2);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 12px;position:sticky;top:18px;z-index:5}
.ib.burger{display:none}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--input);border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:44px;color:var(--mu)}
.search input{border:0;background:none;outline:none;flex:1;font-size:15px;color:var(--ink);min-height:42px}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--input);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.chip{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:14px;border:1px solid var(--line);background:var(--input);cursor:pointer;min-height:44px}
.chip b{display:block;font-size:14px;line-height:1.2}.chip small{color:var(--mu);font-size:12px}
.av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));flex:none;position:relative}
.av.s{width:28px;height:28px;border-radius:9px;font-size:11px}
.av .st{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--solid);background:#94a3b8}
.av .st.on{background:#22c55e}
.view{display:flex;flex-direction:column;gap:18px;padding-bottom:30px}
.hello{color:var(--mu);margin:0}
h1{font-size:clamp(26px,3vw,34px);line-height:1.1;margin:2px 0 4px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:700;display:flex;align-items:center;gap:10px}
.sub{color:var(--mu);margin:0}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}

/* кнопки и поля */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:13px;border:1px solid var(--line);background:var(--input);cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;box-shadow:0 8px 20px rgba(91,95,240,.28)}
.btn.d{color:var(--bad)}.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.6;cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar .search{flex:1 1 240px}
select.f,input.f{min-height:44px;padding:8px 12px;border-radius:13px;border:1px solid var(--line);background:var(--input);font-size:15px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:14px;background:var(--hover)}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--mu);min-height:38px}
.tabs button.on{background:var(--card2);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}

/* дашборд */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.kpi{padding:18px 20px}
.kpi .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--tile);color:var(--acc);margin-bottom:14px}
.kpi .ic.v{color:#8b5cf6;background:rgba(139,92,246,.14)}.kpi .ic.s{color:#0ea5e9;background:rgba(14,165,233,.14)}.kpi .ic.k{color:#ec4899;background:rgba(236,72,153,.13)}
.kpi span{color:var(--mu);font-size:14px;font-weight:600}
.kpi b{display:block;font-size:clamp(22px,2.2vw,28px);font-weight:800;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.delta{font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.delta.up{color:var(--ok)}.delta.dn{color:var(--bad)}.delta.eq{color:var(--mu)}
.delta em{font-style:normal;color:var(--mu);font-weight:500;margin-left:4px}
.g2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px}
.g2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.stk{display:flex;flex-direction:column;gap:18px}.stk>.panel{flex:1}
.panel{padding:20px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ph .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--tile);color:var(--acc)}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fig{position:relative;height:260px}
.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--solid);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;box-shadow:var(--shadow);transform:translate(-50%,-115%);white-space:nowrap;display:none}
.tip b{display:block;font-size:14px}
.donut{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;align-items:center}
.donut .ring{position:relative;width:190px;height:190px}
.donut .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .ctr b{font-size:28px;font-weight:800;line-height:1}.donut .ctr span{color:var(--mu);font-size:13px}
.leg{display:grid;gap:10px;font-size:14px}
.leg div{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center}
.leg i{width:10px;height:10px;border-radius:50%}.leg small{display:block;color:var(--mu);font-size:12px}
.leg b{font-variant-numeric:tabular-nums}
.bars{display:grid;gap:14px}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr) 56px;gap:12px;align-items:center;font-size:14px}
.track{height:10px;border-radius:10px;background:var(--hover);overflow:hidden}
.track i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.funnel{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:center}
.fsteps{display:grid;gap:6px;justify-items:center}
.fstep{height:52px;display:grid;place-content:center;text-align:center;color:#fff;font-weight:800;font-size:17px;line-height:1.1;clip-path:polygon(0 0,100% 0,94% 100%,6% 100%);border-radius:6px}
.fstep small{display:block;font-size:11px;font-weight:600;opacity:.9}
.flab{display:grid;gap:6px}
.flab div{height:52px;display:flex;flex-direction:column;justify-content:center;border-left:2px dotted var(--line);padding-left:12px}
.flab b{font-size:16px}.flab span{color:var(--mu);font-size:13px}
.empty{padding:34px 18px;text-align:center;color:var(--mu)}

/* таблицы */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:600;color:var(--mu);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.cl{cursor:pointer}.tbl tbody tr.cl:hover{background:var(--hover)}
.tbl .who{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--tile);color:var(--acc)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.mu{background:var(--hover);color:var(--mu)}
.pill.warn{background:rgba(217,119,6,.13);color:var(--warn)}
.ov-x{overflow-x:auto}

/* канбан */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:290px;gap:16px;overflow-x:auto;padding:2px 2px 14px;align-items:start}
.col{padding:12px;min-height:240px;border-radius:18px;display:flex;flex-direction:column;gap:10px}
.col.over{outline:2px dashed var(--acc);outline-offset:-4px}
.chd{display:flex;align-items:flex-start;gap:8px;padding:2px 4px 8px;border-bottom:3px solid var(--c);margin-bottom:2px}
.chd .nm{flex:1;font-weight:800}.chd small{display:block;color:var(--mu);font-weight:600;font-size:12px}
.chd .ib{width:32px;height:32px;border-radius:10px}
.dc{background:var(--card2);border:1px solid var(--stroke);border-radius:14px;padding:12px;cursor:grab;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.05);border-left:4px solid var(--c)}
.dc:hover{border-color:var(--acc)}
.dc b{display:block;font-size:15px;margin-bottom:2px}
.dc .m{color:var(--mu)}.dc .am{font-weight:800;font-size:15px;margin-top:6px}
.dc .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.dc.drag{opacity:.4}
.addc{border:1px dashed var(--line);background:none;border-radius:12px;padding:10px;color:var(--mu);cursor:pointer;font-weight:600;min-height:42px}
.addc:hover{color:var(--acc);border-color:var(--acc)}
.newcol{min-height:240px;border:2px dashed var(--line);border-radius:18px;display:grid;place-content:center;gap:8px;text-align:center;color:var(--mu);cursor:pointer;background:none;font-weight:700}
.newcol:hover{color:var(--acc);border-color:var(--acc)}
.red{color:var(--bad)}

/* задачи, база знаний */
.trow{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}.trow .t{flex:1;cursor:pointer}.trow .m{color:var(--mu);font-size:13px}
.chk{width:22px;height:22px;accent-color:var(--acc);cursor:pointer;flex:none}
.trow.done .t>span{text-decoration:line-through;color:var(--mu)}
details.kb{margin-bottom:10px;padding:0}
details.kb summary{padding:16px 18px;cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
details.kb .body{padding:0 18px 16px;white-space:pre-wrap;line-height:1.6}

/* сотрудники */
.perms{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.ck{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--input);font-size:14px;color:var(--ink)!important}
.ck input{width:18px;height:18px;accent-color:var(--acc)}
.sw{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--input);cursor:pointer;color:var(--ink)!important}
.sw input{width:20px;height:20px;accent-color:var(--acc);margin-top:2px;flex:none}.sw small{display:block;color:var(--mu)}
.dlg .sw{display:flex}.dlg .sw span{display:block}
.acl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.acl th,.acl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}.acl tr:last-child th,.acl tr:last-child td{border-bottom:0}
.acl thead th{font-size:12px;color:var(--mu);font-weight:600;background:var(--hover)}.acl tbody th{text-align:left;font-weight:700;color:var(--ink);white-space:nowrap}
.acl .na{color:var(--mu)}.acl .cb{display:inline-grid!important;place-items:center;width:36px;height:36px;cursor:pointer;margin:0 auto}
.acl input{width:20px;height:20px;accent-color:var(--acc);cursor:pointer}.acl input:disabled{cursor:not-allowed;opacity:.35}
.pre{border:0;background:none;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mu)}.pre.on,.pre:hover{background:var(--card2);color:var(--ink)}
.acc{display:grid;gap:8px}.accr{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center}.accr b{font-size:14px;color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:12px;background:var(--hover)}
.seg label{position:relative;display:block!important;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mu)!important}
.seg label.on{background:var(--card2);color:var(--ink)!important;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.seg input{position:absolute;opacity:0;pointer-events:none}.seg label:focus-within{outline:2px solid var(--acc)}
.chev:disabled{cursor:default;filter:none}
@media (max-width:600px){.accr{grid-template-columns:minmax(0,1fr)}}
.online{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.online i{width:8px;height:8px;border-radius:50%;background:#94a3b8}.online.on{color:var(--ok);font-weight:700}.online.on i{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.stats{display:flex;flex-wrap:wrap;gap:10px}

/* модальные окна */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,40,.45);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
.ov[hidden]{display:none}
.dlg{width:min(600px,100%);background:var(--solid);border:1px solid var(--line);border-radius:22px;padding:24px;display:grid;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.dlg h2{font-size:20px}
.dlg label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--mu)}
.dlg input:not([type=checkbox]):not([type=radio]),.dlg select,.dlg textarea{min-height:46px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--input);font-size:16px;color:var(--ink);font-weight:500}
.dlg textarea{min-height:110px;resize:vertical}.dlg textarea.lg{min-height:280px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}.acts .sp{flex:1}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sws label{display:block;cursor:pointer}.sws input{position:absolute;opacity:0;pointer-events:none}
.sws span{display:block;width:34px;height:34px;border-radius:10px;border:3px solid transparent}
.sws input:checked+span{border-color:var(--ink)}
.sws input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.cfm{z-index:55;align-items:center}.dlg.sm{width:min(420px,100%)}
.btn.dl{background:var(--bad);color:#fff;border:0}
.copy{display:flex;gap:8px}.copy input{flex:1}
.err{color:var(--bad);font-size:14px;min-height:1em;margin:0}
.note{padding:12px 14px;border-radius:12px;background:var(--hover);font-size:14px}

/* вход */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.authc{width:min(940px,100%);display:grid;grid-template-columns:1.05fr 1fr;overflow:hidden;padding:0}
.authart{padding:34px;color:#fff;background:linear-gradient(150deg,var(--acc),var(--acc2));display:flex;flex-direction:column;gap:18px;position:relative;min-height:440px}
.authart h1{color:#fff;font-size:30px}.authart p{margin:0;opacity:.9}
.authart .mini{margin-top:auto;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:18px;padding:16px;backdrop-filter:blur(8px)}
.authart .mini b{font-size:24px}.authart svg.wave{width:100%;height:90px;display:block;margin-top:8px}.authart .mk svg.i{width:20px;height:20px}
.authf{padding:38px 34px;display:grid;gap:14px;align-content:center;background:var(--card2)}
.authf label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--mu)}
.authf input{min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--input);font-size:16px;color:var(--ink)}

[data-theme=dark]{--bg:#0f1240;--bg2:#2a1466;--b1:#3b2bb8;--b2:#7a2bb8;--b3:#1d6fd6;--card:rgba(30,32,110,.55);--card2:rgba(255,255,255,.12);--stroke:rgba(170,160,255,.18);--line:rgba(190,180,255,.16);--mu:#a8acd8;--acc:#6f7cff;--acc2:#b06bff;--input:rgba(10,10,50,.45);--hover:rgba(255,255,255,.08);--tile:rgba(111,124,255,.2)}

.shell{display:grid;grid-template-columns:64px minmax(0,1fr);gap:0;padding:0;min-height:100vh}

.attc button{border:0;background:none;color:var(--mu);cursor:pointer;border-radius:6px;padding:2px 6px}.attc button:hover{color:var(--bad);background:var(--badbg)}

.tcard{background:#fff8e1;border:1px solid #f6e3a4;box-shadow:none}

.tcard.over{background:#fff1e6;border-color:#fbcfa9}[data-theme=dark] .tcard.over{background:rgba(249,115,22,.12);border-color:rgba(249,115,22,.35)}
.tcard .tl-h{gap:10px}.tcard .tcl{cursor:pointer;font-weight:600}.tcard .tcl:hover{color:var(--acc)}

.tnote{color:var(--mu);font-size:14px;padding-left:32px}
.tact{display:flex;align-items:center;gap:14px;margin-top:12px;padding-left:32px}.tact .sp{flex:1}

@media (max-width:600px){.tlcol::before{left:15px}.tl{grid-template-columns:32px minmax(0,1fr)}.tl-ic{width:32px;height:32px}.tnote,.tact{padding-left:0}}

/* товары и услуги в сделке */
.dprod .ph .lnk{display:inline-flex;align-items:center;gap:4px}.dprod .ph .lnk svg{width:14px;height:14px}

@media (max-width:600px){.dpr{grid-template-columns:minmax(0,1fr) auto auto}.dpr .dps{grid-column:1/-1;grid-row:2;justify-self:end;margin-top:-6px}.ppr{grid-template-columns:22px minmax(0,1fr) 56px}.ppp{display:none}}

   и карточки становятся пустыми мутными прямоугольниками */

.twork.pause i{background:#fbbf24;border-color:#fde68a}
.tsp{flex:1}
.tuser{display:inline-flex;align-items:center;gap:10px;border:0;background:none;color:#fff;cursor:pointer;padding:4px 8px 4px 4px;border-radius:24px;max-width:280px}

.tuser .av{width:34px;height:34px;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.tun{display:grid;text-align:left;line-height:1.15;min-width:0}.tun b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tun small{font-size:11.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tuser>svg{width:14px;height:14px;opacity:.8}

.tpill:hover{background:rgba(255,255,255,.22)}.tpill svg{width:16px;height:16px}
.tpill.tinv{background:#4fd1c5;border-color:transparent;color:#0b3b3a}.tpill.tinv:hover{filter:brightness(1.06)}
.thelp{width:36px;height:36px;border-radius:10px;border:0;background:#3b9cff;color:#fff;font-weight:800;font-size:17px;cursor:pointer;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.thelp:hover{filter:brightness(1.08)}
.tbar .tb{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25);color:#fff}
.tnav.tsub{position:sticky;top:64px;z-index:14;display:flex;padding:6px 14px;background:var(--card2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex:none}

.tpop button,.tpop a{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:9px;color:var(--ink);font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;text-align:left}

.tpop svg{width:16px;height:16px;color:var(--mu)}.tpop .bad{color:var(--bad)}.tpop .bad svg{color:var(--bad)}

@media (max-width:1200px){.tun{display:none}.tclock b{font-size:24px}.tpill span{display:none}.tpill{padding:0 11px}}
@media (max-width:900px){.tbar .tsearch{width:44px}.tbar .tsearch:focus-within{width:200px}.tclock{margin-left:0}.twork{font-size:0;gap:0;padding:8px}.tnav.tsub{top:64px}}

(function (root) {
  const SECTIONS = ['dashboard', 'deals', 'stages', 'contacts', 'products', 'tasks', 'contracts', 'finance', 'kb', 'mail'];

<script>// Поля и разделы карточки сделки, которые компания настраивает сама.

function openFinish(d) {
  const fin = [...D.stages].sort((a, b) => a.pos - b.pos).filter(s => s.kind !== 'open');
  if (!fin.length) return toast('Добавьте этапы «Успешно» и «Отказ» в настройках этапов');
  openModal(`<h2>Завершить сделку</h2><p class="sub">Чем закончилась сделка «${esc(d.title)}»?</p><div class="acts">${fin.map(s => `<button class="btn" type="button" style="background:${s.color};color:#fff;border:0" data-fin="${s.id}">${esc(s.name)}</button>`).join('')}<span class="sp"></span><button class="btn" type="button" data-close>Отмена</button></div>`, dlg => {
    dlg.querySelectorAll('[data-fin]').forEach(b => b.addEventListener('click', () => { closeModal(); moveDeal(d, +b.dataset.fin); }));
  });
}
async function moveDeal(d, st) {
  if (!d || d.stage_id === st) return;
  d.stage_id = st; d.updated_at = Date.now(); render();
  try { await api('PUT', 'deals/' + d.id, { stage_id: st }); toast('Этап: ' + (stageOf(st)?.name || '')); await load(); render(); loadEvents(); } catch (er) { fail(er); await load(); render(); }
}

  const inc = tot(m, 'Доход'), exp = tot(m, 'Расход'), profit = inc - exp, pprofit = tot(pm, 'Доход') - tot(pm, 'Расход');
  const ks = Array.from({ length: 12 }, (_, i) => monthShift(m, i - 11));
  after.push(barChart('ch2', ks.map(k => MS[+k.slice(5) - 1]), [{ name: 'доход', color: 'var(--acc)', vals: ks.map(k => tot(k, 'Доход')) }, { name: 'расход', color: 'var(--pink)', vals: ks.map(k => tot(k, 'Расход')) }], (v, s) => s ? shortRub(v) : rub(v)));

function ask(title, text, o = {}) {
  return new Promise(res => {
    let c = $('#cfm');
    if (!c) { c = document.createElement('div'); c.id = 'cfm'; c.className = 'ov cfm'; document.body.appendChild(c); }
    c.innerHTML = `<div class="dlg sm" role="alertdialog" aria-modal="true" aria-labelledby="cfmt"><h2 id="cfmt">${esc(title)}</h2><p class="sub">${esc(text)}</p><div class="acts"><button class="btn" type="button" data-a="0">${esc(o.no || 'Нет')}</button><span class="sp"></span><button class="btn ${o.ok ? 'p' : 'dl'}" type="button" data-a="1">${esc(o.yes || 'Да')}</button></div></div>`;
    c.hidden = false;
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    const done = v => { c.hidden = true; c.innerHTML = ''; document.removeEventListener('keydown', key, true); res(v); };
    document.addEventListener('keydown', key, true);
    c.onclick = e => { e.stopPropagation(); const b = e.target.closest('[data-a]'); if (b) done(b.dataset.a === '1'); else if (e.target === c) done(false); };
    c.querySelector('[data-a="0"]').focus();
  });
}

const readPerms = f => {
  const acl = Object.fromEntries(PERMS.SECTIONS.map(s => [s, Object.fromEntries(PERMS.ALL.map(a => [a, !!f.querySelector(`[name=p_${s}_${a}]`)?.checked]))]));

};
function bindPerms(f) {
  const box = (s, a) => f.querySelector(`[name=p_${s}_${a}]`);
  const set = (s, a, v) => { const b = box(s, a); if (b && !b.disabled) b.checked = v; };
  const tidy = () => {
    for (const s of PERMS.SECTIONS) {
      if (s === 'stages') continue;
      const v = box(s, 'v');
      ['c', 'e', 'd'].forEach(a => { const b = box(s, a); if (b) b.disabled = !v.checked || !(P().director || P().acl[s][a]); });
    }
    ['c', 'e', 'd'].forEach(a => { const b = box('stages', a); b.disabled = !box('deals', 'v').checked || !(P().director || P().acl.stages[a]); });
    const fin = !f.money.checked;
    PERMS.ACTIONS.finance.forEach(a => { const b = box('finance', a); if (fin) b.checked = false; b.disabled = fin || !(P().director || P().acl.finance[a]) || (a !== 'v' && !box('finance', 'v').checked); });
  };
  f.addEventListener('change', e => {
    const m = (e.target.name || '').match(/^p_(\w+)_([vced])$/);
    if (m) {
      const [, s, a] = m;
      if (a === 'v' && !e.target.checked) ['c', 'e', 'd'].forEach(x => set(s, x, false));
      if (s === 'deals' && a === 'v' && !e.target.checked) ['c', 'e', 'd'].forEach(x => set('stages', x, false));
      if (s === 'finance' && e.target.checked) f.money.checked = true;
    }
    f.querySelectorAll('.pre').forEach(b => b.classList.remove('on'));
    tidy();
  });
  f.querySelectorAll('.pre').forEach(b => b.addEventListener('click', () => {
    const n = PERMS.preset(b.dataset.preset);
    PERMS.SECTIONS.forEach(s => PERMS.ACTIONS[s].forEach(a => { const x = box(s, a); if (x) x.checked = n.acl[s][a] && (P().director || P().acl[s][a]); }));
    f.money.checked = n.money && (P().director || P().money); f.onlyOwn.checked = n.onlyOwn;
    f.querySelectorAll('.pre').forEach(x => x.classList.toggle('on', x === b));
    tidy();
  }));
  tidy();
}

function searchHits(q) {

  if (can('contacts')) out.push(['Клиенты', 'contacts', D.contacts.filter(c => has(c.name) || has(c.company) || has(c.email) || has(c.position) || ph(c.phone)).map(c => ({ act: `data-act="edit" data-e="contacts" data-id="${c.id}"`, t: c.name, s: [c.company, c.phone, c.email].filter(Boolean).join(' · ') }))]);
  if (can('products')) out.push(['Товары и услуги', 'products', (D.products || []).filter(x => has(x.name) || has(x.sku) || has(x.note)).map(x => ({ act: `data-act="edit" data-e="products" data-id="${x.id}"`, t: x.name, s: [x.kind, x.sku, money() && x.price != null ? rub(x.price) : ''].filter(Boolean).join(' · ') }))]);
  if (can('tasks')) out.push(['Задачи', 'tasks', D.tasks.filter(x => has(x.title) || has(x.note)).map(x => ({ act: `data-act="edit" data-e="tasks" data-id="${x.id}"`, t: x.title, s: (x.done ? 'выполнена' : dueText(x) ? 'срок ' + dueText(x) : '') }))]);
  if (can('contracts')) out.push(['Договоры', 'contracts', D.contracts.filter(c => has(c.num) || has(c.title) || has(cById(c.contact_id)?.name)).map(c => ({ act: `data-act="edit" data-e="contracts" data-id="${c.id}"`, t: '№ ' + c.num + (c.title ? ' · ' + c.title : ''), s: [cById(c.contact_id)?.name, c.status].filter(Boolean).join(' · ') }))]);
  if (can('kb')) out.push(['База знаний', 'kb', D.kb.filter(x => has(x.title) || has(x.cat) || has(x.body)).map(x => ({ act: `data-act="edit" data-e="kb" data-id="${x.id}"`, t: x.title, s: x.cat || '' }))]);
  if (P().team && D.team) out.push(['Сотрудники', 'team', D.team.filter(x => has(x.name) || has(x.email) || has(x.position)).map(x => ({ act: x.role !== 'director' && x.id !== D.me.id ? `data-act="member" data-id="${x.id}"` : 'data-act="go" data-v="team"', t: x.name, s: [x.position, x.email].filter(Boolean).join(' · ') }))]);
  return out.filter(g => g[2].length);
}

function mailDoc(html, img) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,iframe,frame,object,embed,form,meta,base,link').forEach(x => x.remove());
  let blocked = 0;
  doc.querySelectorAll('*').forEach(el => {
    for (const a of [...el.attributes]) {
      if (/^on/i.test(a.name)) el.removeAttribute(a.name);
      else if (/^(href|src|action|formaction|xlink:href)$/i.test(a.name) && /^\s*(javascript|vbscript):/i.test(a.value)) el.removeAttribute(a.name);
    }
    if (img) return;
    if (el.tagName === 'IMG' && /^\s*(https?:)?\/\//i.test(el.getAttribute('src') || '')) { el.removeAttribute('src'); el.removeAttribute('srcset'); if (+el.getAttribute('width') <= 3 || +el.getAttribute('height') <= 3 || !el.getAttribute('alt')) el.style.display = 'none'; blocked++; }
    if (el.hasAttribute('background')) { el.removeAttribute('background'); blocked++; }
    const st = el.getAttribute('style'); if (st && /url\s*\(/i.test(st)) { el.setAttribute('style', st.replace(/url\s*\([^)]*\)/gi, 'none')); blocked++; }
  });
  if (!img) doc.querySelectorAll('style').forEach(x => { if (/url\s*\(|@import/i.test(x.textContent)) { x.textContent = x.textContent.replace(/@import[^;]+;/gi, '').replace(/url\s*\([^)]*\)/gi, 'none'); blocked++; } });
  const css = '<base target="_blank"><style>html,body{margin:0}body{padding:2px 4px 16px;font:14px/1.55 Arial,Helvetica,sans-serif;color:#1d2340;background:#fff;overflow-wrap:anywhere}img{max-width:100%;height:auto}a{color:#4f46e5}blockquote{margin:0 0 0 6px;padding-left:12px;border-left:3px solid #d9dcf0;color:#4b5275}table{max-width:100%}</style>';
  return { html: '<!doctype html><html><head><meta charset="utf-8">' + css + doc.head.innerHTML + '</head><body>' + doc.body.innerHTML + '</body></html>', blocked };
}

    : st.items.length ? st.items.slice(0, 8).map(x => `<button class="mrow" data-act="mail-goto" data-f="${esc(x.folder)}" data-uid="${x.uid}"><span class="mdir ${x.dir}">${I(x.dir === 'in' ? 'inbox' : 'send')}</span><span class="mrs ${x.seen ? '' : 'new'}">${esc(x.subject)}</span><time>${fdate(x.date)}</time></button>`).join('')
    : `<p class="sub">Писем с ${esc(email)} пока нет</p>`;
  return `<section class="glass panel"><div class="ph"><h2>Переписка</h2>${may('mail', 'c') && !st.noacc ? `<button class="lnk" data-act="mail-new" data-to="${esc(email)}">написать</button>` : ''}</div>${body}</section>`;
}
async function loadDealMail() {
  const st = DEAL && DEAL.mail; if (!st) return;
  try {
    if (MB.acc === undefined) MB.acc = (await api('GET', 'mail/account')).account;
    if (!MB.acc) st.noacc = true;
    else st.items = (await api('GET', 'mail/contact?email=' + enc(st.email))).items;
  } catch (e) { st.err = e.message; }
  if (VIEW === 'deal' && !busy()) render();
}

function openCompose(o = {}) {
  if (!may('mail', 'c')) return toast('У вас нет права отправлять письма');
  if (MB.acc === undefined) return mailInit().then(() => MB.acc ? openCompose(o) : (toast('Сначала подключите почту'), location.hash = 'mail'));
  if (!MB.acc) { toast('Сначала подключите почту'); location.hash = 'mail'; return; }
  const files = [], opts = [...new Map(D.contacts.filter(c => c.email).map(c => [c.email.trim().toLowerCase(), c])).values()];
  openModal(`<h2>${esc(o.title || 'Новое письмо')}</h2><form id="mc" class="fm mcomp" novalidate>
    <label>Кому<input name="to" list="mlc" value="${esc(o.to || '')}" placeholder="client@example.ru" autocomplete="off" required></label>
    <label>Копия<input name="cc" list="mlc" value="${esc(o.cc || '')}" autocomplete="off" placeholder="необязательно"></label>
    <datalist id="mlc">${opts.map(c => `<option value="${esc(c.email.trim())}">${esc(c.name)}${c.company ? ' · ' + esc(c.company) : ''}</option>`).join('')}</datalist>
    <label>Тема<input name="subject" value="${esc(o.subject || '')}" autocomplete="off"></label>
    <label>Текст письма<textarea name="text" rows="10">${esc(o.text || '')}</textarea></label>
    ${o.forward ? `<p class="sub" style="font-size:13px;margin:0">${I('clip')} Вложения исходного письма отправятся вместе с письмом</p>` : ''}
    <div class="mfl" id="mfl"></div>
    <label class="btn sm mattach">${I('clip')}Прикрепить файлы<input type="file" multiple id="mfi" hidden></label>
    <p class="err" id="mce2" role="alert"></p>
    <div class="acts"><button class="btn" type="button" data-close>Отмена</button><span class="sp"></span><button class="btn p">${I('send')}Отправить</button></div></form>`, dlg => {
    const f = dlg.querySelector('#mc'), er = dlg.querySelector('#mce2'), fl = dlg.querySelector('#mfl');
    dlg.querySelector('[data-close]').addEventListener('click', closeModal);
    const draw = () => { fl.innerHTML = files.map((x, i) => `<span class="pill">${esc(x.name)} · ${fsize(x.size)} <button type="button" class="lnk" data-rm="${i}" aria-label="Убрать файл">✕</button></span>`).join(' '); fl.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => { files.splice(+b.dataset.rm, 1); draw(); })); };
    dlg.querySelector('#mfi').addEventListener('change', e => {
      for (const file of e.target.files) {
        if (files.length >= 10) { er.textContent = 'Можно прикрепить не больше 10 файлов'; break; }
        if (sum(files, x => x.size) + file.size > 20 * 1048576) { er.textContent = 'Вместе вложения не должны быть больше 20 МБ'; break; }
        files.push(file);
      }
      e.target.value = ''; draw();
    });
    if (!o.to) setTimeout(() => f.to.focus(), 40); else if (o.text && !o.forward) setTimeout(() => { f.text.focus(); f.text.setSelectionRange(0, 0); f.text.scrollTop = 0; }, 40); else setTimeout(() => f.subject.focus(), 40);
    f.addEventListener('submit', async e => {
      e.preventDefault(); er.textContent = '';
      const v = Object.fromEntries(new FormData(f));
      const bad = v.to.split(/[,;\s]+/).concat(v.cc.split(/[,;\s]+/)).filter(Boolean).find(x => !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x));
      if (!v.to.trim()) return er.textContent = 'Укажите, кому отправить письмо';
      if (bad) return er.textContent = `Адрес «${bad}» указан неверно`;
      const b = f.querySelector('button.p'); b.disabled = true; b.lastChild.textContent = 'Отправляем…';
      try {
        const attachments = await Promise.all(files.map(x => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok({ name: x.name, type: x.type, data: String(r.result).split(',')[1] || '' }); r.onerror = () => no(new Error('Не удалось прочитать файл ' + x.name)); r.readAsDataURL(x); })));
        const r = await api('POST', 'mail/send', { ...v, inReplyTo: o.inReplyTo, references: o.references, forward: o.forward, attachments });
        closeModal(); toast(r.deals ? 'Письмо отправлено и добавлено в историю сделки' : 'Письмо отправлено');

      } catch (x) { er.textContent = x.message; b.disabled = false; b.lastChild.textContent = 'Отправить'; }
    });
  });
}
function quoteOf(m) {
  const t = (m.text || htmlText(m.html)).trim();
  return '\n\n\n' + (m.date ? fdt(m.date) + ', ' : '') + who(m.from) + ' <' + m.from.email + '> пишет:\n' + t.split('\n').map(l => '> ' + l).join('\n');
}
async function mailAct(k, a) {
  const m = MB.msg;
  if (k === 'mail-new') return openCompose({ to: a.dataset.to || '' });
  if (k === 'mail-folder') { MB.folder = a.dataset.v; MB.page = 1; MB.sel = null; MB.msg = null; MB.list = null; MB.q = ''; Q = ''; return mailList(); }
  if (k === 'mail-open') return mailOpen(+a.dataset.uid);
  if (k === 'mail-back') { MB.sel = null; MB.msg = null; return render(); }
  if (k === 'mail-page') { MB.page = Math.max(1, MB.page + +a.dataset.v); MB.sel = null; return mailList(); }
  if (k === 'mail-q0') { MB.q = ''; Q = ''; MB.page = 1; return mailList(); }
  if (k === 'mail-refresh') { MB.err = ''; await mailFolders(); return mailList(); }
  if (k === 'mail-img') { MB.img = true; return render(); }
  if (k === 'mail-att') return toast('В предпросмотре вложения не скачиваются — на сервере файл откроется');
  if (k === 'mail-cancel') { MB.editing = false; return render(); }
  if (k === 'mail-goto') { MB.folder = a.dataset.f; MB.page = 1; MB.q = ''; MB.list = null; location.hash = 'mail'; mailList(true); return mailOpen(+a.dataset.uid); }
  if (k === 'mail-acc') return openModal(`<h2>Настройки почты</h2><p class="sub">Подключён ящик <b>${esc(MB.acc.email)}</b>. Сервер получения: ${esc(MB.acc.imap_host)}, отправки: ${esc(MB.acc.smtp_host)}.</p>
     <div class="acts"><button class="btn dl" type="button" id="mdis">Отключить почту</button><span class="sp"></span><button class="btn" type="button" data-close>Закрыть</button><button class="btn p" type="button" id="medit">Изменить</button></div>`, dlg => {
    dlg.querySelector('[data-close]').addEventListener('click', closeModal);
    dlg.querySelector('#medit').addEventListener('click', () => { closeModal(); MB.editing = true; render(); });
    dlg.querySelector('#mdis').addEventListener('click', async () => {
      closeModal();
      if (!await ask('Отключить почту?', 'Письма останутся в вашем почтовом ящике, но в Орбите вы их больше не увидите, пока не подключите почту снова.')) return;
      try { await api('DELETE', 'mail/account'); mailReset(); MB.acc = null; setMailBadge(0); render(); toast('Почта отключена'); } catch (x) { fail(x); }
    });
  });
  if (!m) return;
  if (k === 'mail-reply') {
    const all = !!a.dataset.all, me = MB.acc.email;
    const cc = all ? [...m.to, ...m.cc].map(x => x.email).filter(x => x && x !== me && x !== m.from.email) : [];
    return openCompose({ title: 'Ответ', to: m.from.email, cc: [...new Set(cc)].join(', '), subject: /^re:/i.test(m.subject) ? m.subject : 'Re: ' + m.subject, text: quoteOf(m), inReplyTo: m.messageId, references: [m.references, m.messageId].filter(Boolean).join(' ') });
  }
  if (k === 'mail-fwd') return openCompose({ title: 'Пересылка', subject: /^fwd?:/i.test(m.subject) ? m.subject : 'Fwd: ' + m.subject, text: '\n\n\n---------- Пересланное письмо ----------\nОт: ' + who(m.from) + ' <' + m.from.email + '>\n' + (m.date ? 'Дата: ' + fdt(m.date) + '\n' : '') + 'Тема: ' + m.subject + '\n\n' + (m.text || htmlText(m.html)), forward: m.atts.length ? { folder: m.folder, uid: m.uid } : null });
  if (k === 'mail-unread') { try { await api('POST', 'mail/seen', { folder: m.folder, uid: m.uid, seen: false }); const it = MB.list?.items.find(x => x.uid === m.uid); if (it) it.seen = false; if ((MB.folders.find(f => f.path === m.folder) || {}).special === 'inbox') setMailBadge(MB.unseen + 1); MB.sel = null; MB.msg = null; render(); } catch (x) { fail(x); } return; }
  if (k === 'mail-del') {
    if (!await ask('Удалить письмо?', (MB.folders.find(f => f.path === m.folder) || {}).special === 'trash' ? 'Письмо будет удалено из корзины навсегда.' : 'Письмо переместится в корзину почтового ящика.')) return;
    try { await api('DELETE', `mail/msg?folder=${enc(m.folder)}&uid=${m.uid}`); if (MB.list) MB.list.items = MB.list.items.filter(x => x.uid !== m.uid); MB.sel = null; MB.msg = null; render(); toast('Письмо удалено'); mailFolders().then(() => VIEW === 'mail' && !busy() && render()); } catch (x) { fail(x); }
  }
}
